name: Tectonic Android POC

on:
  workflow_dispatch:

jobs:
  build-tectonic-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            git \
            ninja-build \
            pkg-config \
            curl \
            zip \
            unzip \
            tar

      - name: Configure Android linker
        shell: bash
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          EOF

      - name: Setup vcpkg Android triplet
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          cat > /tmp/vcpkg/triplets/community/arm64-android-tectonic.cmake <<'EOF'
          set(VCPKG_TARGET_ARCHITECTURE arm64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CMAKE_SYSTEM_NAME Android)
          set(VCPKG_CMAKE_SYSTEM_VERSION 24)
          set(VCPKG_MAKE_BUILD_TRIPLET "x64-linux-release")
          EOF
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          cat >> "$GITHUB_ENV" <<EOF
          VCPKG_ROOT=/tmp/vcpkg
          VCPKGRS_TRIPLET=arm64-android-tectonic
          VCPKG_FORCE_SYSTEM_BINARIES=1
          EOF

      - name: Build Android target dependencies with vcpkg
        shell: bash
        run: |
          /tmp/vcpkg/vcpkg install \
            fontconfig:arm64-android-tectonic \
            freetype:arm64-android-tectonic \
            'harfbuzz[graphite2]:arm64-android-tectonic' \
            icu:arm64-android-tectonic \
            libpng:arm64-android-tectonic \
            zlib:arm64-android-tectonic

      - name: Clone Tectonic
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/tectonic-typesetting/tectonic.git /tmp/tectonic

      - name: Build Tectonic CLI for Android ARM64
        id: tectonic-build
        shell: bash
        working-directory: /tmp/tectonic
        continue-on-error: true
        env:
          TECTONIC_DEP_BACKEND: vcpkg
          VCPKG_ROOT: /tmp/vcpkg
          VCPKGRS_TRIPLET: arm64-android-tectonic
        run: |
          cargo build --release --target aarch64-linux-android -p tectonic 2>&1 | tee "$GITHUB_WORKSPACE/tectonic-android-build.log"

      - name: Collect result
        shell: bash
        run: |
          mkdir -p tectonic-android-poc
          cp tectonic-android-build.log tectonic-android-poc/
          if [ -f /tmp/tectonic/target/aarch64-linux-android/release/tectonic ]; then
            cp /tmp/tectonic/target/aarch64-linux-android/release/tectonic tectonic-android-poc/tectonic-aarch64-linux-android
            file tectonic-android-poc/tectonic-aarch64-linux-android | tee tectonic-android-poc/file.txt
          else
            echo "Tectonic Android binary was not produced." | tee tectonic-android-poc/file.txt
          fi

      - name: Upload POC logs and binary if available
        uses: actions/upload-artifact@v4
        with:
          name: tectonic-android-poc
          path: tectonic-android-poc/
          if-no-files-found: error

      - name: Fail when Tectonic Android build failed
        if: steps.tectonic-build.outcome != 'success'
        shell: bash
        run: |
          echo "Tectonic Android POC failed. See tectonic-android-build.log artifact for details."
          exit 1

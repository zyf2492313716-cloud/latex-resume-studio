name: Tectonic Android POC

on:
  workflow_dispatch:

jobs:
  build-tectonic-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Initialize POC artifact directory
        shell: bash
        run: |
          mkdir -p tectonic-android-poc
          echo "Tectonic Android POC started at $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > tectonic-android-poc/README.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Android NDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            git \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            ninja-build \
            pkg-config \
            curl \
            zip \
            unzip \
            tar

      - name: Configure Android linker
        shell: bash
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CC_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          CXX_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang++
          AR_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          EOF

      - name: Setup vcpkg Android triplet
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          cat >> "$GITHUB_ENV" <<EOF
          VCPKG_ROOT=/tmp/vcpkg
          VCPKGRS_TRIPLET=arm64-android
          VCPKG_FORCE_SYSTEM_BINARIES=1
          EOF

      - name: Build Android target dependencies with vcpkg
        shell: bash
        run: |
          /tmp/vcpkg/vcpkg install \
            'fontconfig[core]:arm64-android' \
            freetype:arm64-android \
            'harfbuzz[graphite2]:arm64-android' \
            icu:arm64-android \
            libpng:arm64-android \
            zlib:arm64-android \
            'fontconfig[core]:x64-android' \
            freetype:x64-android \
            'harfbuzz[graphite2]:x64-android' \
            icu:x64-android \
            libpng:x64-android \
            zlib:x64-android

      - name: Clone Tectonic
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/tectonic-typesetting/tectonic.git /tmp/tectonic

      - name: Build Tectonic CLI for Android ARM64
        id: tectonic-build
        shell: bash
        working-directory: /tmp/tectonic
        continue-on-error: true
        env:
          TECTONIC_DEP_BACKEND: vcpkg
          VCPKG_ROOT: /tmp/vcpkg
        run: |
          set -o pipefail
          echo "vcpkg fontconfig/iconv artifacts:"
          find /tmp/vcpkg/installed/arm64-android -maxdepth 4 \
            \( -iname '*fontconfig*' -o -iname '*iconv*' -o -iname '*charset*' \) -print | sort || true
          VCPKGRS_TRIPLET=arm64-android \
            cargo build --release --target aarch64-linux-android -p tectonic 2>&1 | tee "$GITHUB_WORKSPACE/tectonic-android-build.log"
          echo "\n===== x86_64 Android build =====" | tee -a "$GITHUB_WORKSPACE/tectonic-android-build.log"
          VCPKGRS_TRIPLET=x64-android \
            cargo build --release --target x86_64-linux-android -p tectonic 2>&1 | tee -a "$GITHUB_WORKSPACE/tectonic-android-build.log"

      - name: Collect result
        shell: bash
        run: |
          mkdir -p tectonic-android-poc
          cp tectonic-android-build.log tectonic-android-poc/
          if [ -f /tmp/tectonic/target/aarch64-linux-android/release/tectonic ]; then
            cp /tmp/tectonic/target/aarch64-linux-android/release/tectonic tectonic-android-poc/tectonic-aarch64-linux-android
            file tectonic-android-poc/tectonic-aarch64-linux-android | tee tectonic-android-poc/file.txt
          else
            echo "Tectonic Android binary was not produced." | tee tectonic-android-poc/file.txt
          fi
          if [ -f /tmp/tectonic/target/x86_64-linux-android/release/tectonic ]; then
            cp /tmp/tectonic/target/x86_64-linux-android/release/tectonic tectonic-android-poc/tectonic-x86_64-linux-android
            file tectonic-android-poc/tectonic-x86_64-linux-android | tee -a tectonic-android-poc/file.txt
          else
            echo "Tectonic x86_64 Android binary was not produced." | tee -a tectonic-android-poc/file.txt
          fi

      - name: Build APK with embedded Tectonic engine
        if: steps.tectonic-build.outcome == 'success'
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/tectonic
          cp /tmp/tectonic/target/aarch64-linux-android/release/tectonic \
            android/app/src/main/assets/tectonic/tectonic-aarch64-linux-android
          cp /tmp/tectonic/target/x86_64-linux-android/release/tectonic \
            android/app/src/main/assets/tectonic/tectonic-x86_64-linux-android
          chmod 755 android/app/src/main/assets/tectonic/tectonic-aarch64-linux-android
          chmod 755 android/app/src/main/assets/tectonic/tectonic-x86_64-linux-android

          npm ci
          npm run build
          npx cap sync android
          cd android
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Verify embedded Tectonic APK
        if: steps.tectonic-build.outcome == 'success'
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -f "$APK"
          test -f "$TEST_APK"
          unzip -l "$APK" | tee tectonic-android-poc/apk-contents.txt
          unzip -l "$APK" | grep 'assets/tectonic/tectonic-aarch64-linux-android'
          unzip -l "$APK" | grep 'assets/tectonic/tectonic-x86_64-linux-android'
          cp "$APK" tectonic-android-poc/latex-resume-studio-tectonic-android-debug.apk
          cp "$TEST_APK" tectonic-android-poc/latex-resume-studio-tectonic-androidTest.apk
          shasum -a 256 tectonic-android-poc/latex-resume-studio-tectonic-android-debug.apk \
            | tee tectonic-android-poc/apk.sha256
          shasum -a 256 tectonic-android-poc/latex-resume-studio-tectonic-androidTest.apk \
            | tee -a tectonic-android-poc/apk.sha256

      - name: Upload POC logs and APK before runtime smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tectonic-android-poc
          path: tectonic-android-poc/
          if-no-files-found: error

      - name: Run Tectonic instrumentation smoke test
        if: steps.tectonic-build.outcome == 'success'
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/ci/tectonic-android-smoke.sh

      - name: Fail when Tectonic Android build failed
        if: steps.tectonic-build.outcome != 'success'
        shell: bash
        run: |
          echo "Tectonic Android POC failed. See tectonic-android-build.log artifact for details."
          exit 1
